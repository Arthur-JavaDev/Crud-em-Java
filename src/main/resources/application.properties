# Porta da API
server.port=8081

# Configuracoes do Banco de Dados (Protegido com Variaveis de Ambiente)
spring.datasource.url=jdbc:mysql://localhost:3306/dbEcommerce?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true